<!DOCTYPE html>
<html lang="id">
<head>

<title>Kuis Love Your Environment – Descriptive Text</title>
<style>
:root{--ink:#14213d;--mut:#54627c;--line:#d9e2ef;--card:#fff;--acc:#2563eb;--acc-d:#1d4ed8;--acc-l:#dbeafe;--bg:#eef4ff;--sh:0 10px 30px rgba(20,33,61,.10);--r:20px;--hdr:0px}
body.th0{--acc:#15803d;--acc-d:#14532d;--acc-l:#dcfce7;--bg:#eef9f1}
body.th1{--acc:#0369a1;--acc-d:#0c4a6e;--acc-l:#e0f2fe;--bg:#ecf7fd}
body.th2{--acc:#6d28d9;--acc-d:#4c1d95;--acc-l:#ede9fe;--bg:#f4f0fe}
body.th3{--acc:#c2410c;--acc-d:#7c2d12;--acc-l:#ffedd5;--bg:#fff4ea}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{margin:0;background:linear-gradient(180deg,var(--bg),#fff 70%) fixed;color:var(--ink);font:19px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input{font-family:inherit}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--acc);color:#fff;box-shadow:0 4px 18px rgba(0,0,0,.16)}
.top:empty{display:none}
.top .row{display:flex;align-items:center;gap:16px;padding:12px clamp(14px,3vw,40px) 10px}
.brand{font-weight:800;font-size:1.05rem;letter-spacing:.01em}
.prog{margin-left:auto;display:flex;align-items:center;gap:12px;font-weight:700;white-space:nowrap}
.bar{width:clamp(90px,18vw,220px);height:12px;border-radius:99px;background:rgba(255,255,255,.3);overflow:hidden}
.bar i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .3s}
.steps{display:flex;gap:10px;padding:0 clamp(14px,3vw,40px) 12px;overflow-x:auto;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.timer{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.22);border-radius:99px;padding:4px 14px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.timer b{font-size:1.15rem}
.timer.warn{background:#fef3c7;color:#92400e}
.timer.danger{background:#dc2626;color:#fff}
@media(prefers-reduced-motion:no-preference){.timer.danger{animation:tp 1s ease-in-out infinite}}
@keyframes tp{50%{opacity:.7}}
.step{appearance:none;border:2px solid rgba(255,255,255,.6);background:transparent;color:#fff;border-radius:99px;padding:8px 18px;font-weight:700;font-size:.95rem;cursor:pointer;white-space:nowrap}
.step:hover{background:rgba(255,255,255,.18)}
.step[aria-current="true"]{background:#fff;color:var(--acc-d);border-color:#fff}
.step small{margin-left:8px;font-weight:700;opacity:.85;font-size:.85rem}

/* ---------- layout ---------- */
main{max-width:1500px;margin:0 auto;padding:24px clamp(14px,3vw,40px) 12px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--line)}
.wrap{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:28px;align-items:start}
@media(max-width:980px){.wrap{grid-template-columns:1fr}.passage{position:static!important;max-height:none!important}}

.passage{position:sticky;top:calc(var(--hdr) + 16px);max-height:calc(100vh - var(--hdr) - 150px);overflow:auto;padding:28px 30px 14px;border-left:10px solid var(--acc)}
.kick{font-weight:800;font-size:.85rem;letter-spacing:.07em;text-transform:uppercase;color:var(--acc)}
.passage h2{margin:2px 0 4px;font-size:1.55rem;line-height:1.25;color:var(--acc-d)}
.hint{margin:0 0 6px;color:var(--mut);font-size:.9rem}
.para{display:flex;gap:14px;margin:18px 0}
.pn{flex:none;width:34px;height:34px;border-radius:50%;background:var(--acc-l);color:var(--acc-d);font-weight:800;display:grid;place-items:center;font-size:.95rem;margin-top:3px}
.para p{margin:0;font-size:1.1rem;line-height:1.7}

.aud{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:10px 0 4px}
.aud .btn{padding:9px 18px;font-size:.95rem}
.aud label{display:flex;align-items:center;gap:6px;font-weight:700;font-size:.9rem;color:var(--mut)}
.aud select{font:inherit;padding:8px 10px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.astat{flex-basis:100%;color:var(--mut);font-size:.85rem}
.spk{flex:none;appearance:none;border:2px solid var(--line);background:#fff;border-radius:50%;width:38px;height:38px;cursor:pointer;font-size:1rem;align-self:flex-start}
.spk:hover{border-color:var(--acc);background:var(--acc-l)}
.para.speaking{background:var(--acc-l);border-radius:14px;box-shadow:0 0 0 8px var(--acc-l)}
.q{padding:24px 26px 14px;margin-bottom:22px;scroll-margin-top:calc(var(--hdr) + 16px)}
.qh{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.qn{background:var(--acc);color:#fff;border-radius:99px;padding:5px 16px;font-weight:800}
.q.done .qn::after{content:" ✓"}
.tag{background:var(--acc-l);color:var(--acc-d);border-radius:99px;padding:4px 14px;font-weight:700;font-size:.85rem}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{display:block;width:100%;padding:0;margin:0 0 12px;font-size:1.32rem;font-weight:800;line-height:1.35}
.opt{position:relative;display:flex;gap:14px;align-items:center;padding:13px 16px;border:2px solid var(--line);border-radius:16px;margin:10px 0;cursor:pointer;background:#fff;transition:border-color .15s,background .15s,box-shadow .15s}
.opt:hover{border-color:var(--acc);background:var(--acc-l)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt b{flex:none;width:40px;height:40px;border-radius:50%;background:var(--acc-l);color:var(--acc-d);display:grid;place-items:center;font-weight:800}
.opt span{font-size:1.12rem;line-height:1.45}
.opt.sel{border-color:var(--acc);background:var(--acc-l);box-shadow:0 0 0 3px rgba(0,0,0,.06)}
.opt.sel b{background:var(--acc);color:#fff}
.opt:focus-within{outline:3px solid var(--acc);outline-offset:2px}

/* ---------- pager ---------- */
.pager{position:fixed;left:0;right:0;bottom:0;z-index:15;background:rgba(255,255,255,.95);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;justify-content:space-between;padding:12px clamp(14px,3vw,40px)}
.pager:empty{display:none}
.pinfo{color:var(--mut);font-weight:700;text-align:center;font-size:.95rem}
.btn{appearance:none;border:2px solid var(--acc);border-radius:14px;padding:13px 26px;font-weight:800;font-size:1.05rem;cursor:pointer;background:var(--acc);color:#fff}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:#fff;color:var(--acc-d)}
.btn.danger{background:#fff;color:#b91c1c;border-color:#b91c1c}
.btn:disabled{opacity:.4;cursor:default;filter:none}
.btn.big{padding:16px 40px;font-size:1.2rem}

/* ---------- mulai ---------- */
.hero{max-width:1100px;margin:0 auto;text-align:center;padding-top:clamp(10px,4vw,48px)}
.hero .pillk{display:inline-block;background:var(--acc);color:#fff;border-radius:99px;padding:8px 24px;font-weight:800;letter-spacing:.05em;font-size:.95rem}
.hero h1{margin:22px 0 8px;font-size:clamp(2.2rem,6vw,4.4rem);line-height:1.08;font-weight:800}
.hero .sub{margin:0;font-size:clamp(1.3rem,3vw,2rem);font-weight:700;color:var(--acc)}
.hero .meta{margin:10px 0 30px;color:var(--mut);font-size:1.15rem}
.topics{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;text-align:left;margin-bottom:28px}
.topic{padding:20px 22px 18px;border-top:10px solid var(--c)}
.topic small{display:block;font-weight:800;color:var(--c);letter-spacing:.04em;font-size:.82rem}
.topic b{display:block;margin-top:6px;font-size:1.12rem;line-height:1.3}
.howto{text-align:left;padding:22px 28px;margin-bottom:28px}
.howto h3{margin:0 0 8px}
.howto ul{margin:0;padding-left:22px}.howto li{margin:6px 0}
.startbox{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:center}
.field{display:flex;flex-direction:column;text-align:left;gap:4px}
.field label{font-weight:700;font-size:.9rem;color:var(--mut)}
.field input{font-size:1.1rem;padding:13px 16px;border:2px solid var(--line);border-radius:14px;min-width:min(340px,80vw)}
.field input:focus{outline:3px solid var(--acc);border-color:var(--acc)}
.field .req{color:#dc2626}
.field .err{display:none;color:#b91c1c;font-weight:700;font-size:.85rem}
.field.bad input{border-color:#dc2626;background:#fef2f2}
.field.bad .err{display:block}
.idcard{max-width:900px;margin:0 auto;padding:26px clamp(18px,4vw,34px) 30px;text-align:left}
.idcard h3{margin:0 0 4px;font-size:1.3rem}
.idcard .note{margin:0 0 18px}
.idgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.idgrid .field input{width:100%;min-width:0;box-sizing:border-box}
.idcard .go{display:flex;justify-content:center;margin-top:24px}
.printid{display:none}
.foot{max-width:1500px;margin:0 auto;padding:18px clamp(14px,3vw,40px) 28px;text-align:center;color:var(--mut);font-size:.9rem;line-height:1.5}
.foot span{display:inline-block;border-top:1px solid var(--line);padding-top:14px}
.foot b{color:var(--ink)}
body[class*="th"] .foot{padding-bottom:110px}

/* ---------- hasil ---------- */
.res{max-width:1100px;margin:0 auto}
.res h1{margin:6px 0 4px;font-size:clamp(1.8rem,4vw,2.6rem)}
.summary{padding:22px 26px;margin:18px 0 22px}
.res{text-align:center}
.scorecard{max-width:560px;margin:22px auto;padding:34px clamp(18px,5vw,40px) 30px}
.sc-n{font-size:clamp(5rem,22vw,8rem);line-height:1;font-weight:800;color:var(--acc)}
.sc-l{margin-top:6px;font-weight:700;color:var(--mut)}
.sc-d{margin:18px 0 0;font-size:1.3rem}
.sc-id{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:26px 0 0;padding-top:20px;border-top:1px solid var(--line);text-align:left}
.sc-id dt{font-weight:700;color:var(--mut)}
.sc-id dd{margin:0;font-weight:700;overflow-wrap:anywhere}
.summary .big{font-size:1.5rem;font-weight:800}
.warn{margin:8px 0 0;color:#9a3412;font-weight:700}
.grp{margin:24px 0}
.grp h3{margin:0 0 12px;font-size:1.15rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.cell{appearance:none;border:2px solid var(--c);color:var(--c);background:#fff;border-radius:14px;padding:10px 6px;text-align:center;cursor:pointer;line-height:1.2}
.cell small{display:block;font-weight:700;color:var(--mut)}
.cell b{display:block;font-size:1.9rem}
.cell:hover{background:#f6f9ff}
.cell.empty{border-color:#f59e0b;background:#fff7ed;color:#9a3412}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin:26px 0 12px}
.note{color:var(--mut);font-size:.95rem;margin:10px 0 0}
.rv{text-align:left;margin:34px 0 20px}.rv h2{text-align:center;font-size:1.7rem;margin:0 0 18px}
.rq{padding:20px 24px 18px;margin-bottom:18px;border-left:10px solid #dc2626}.rq.ok{border-left-color:#15803d}
.rq .st{background:#fee2e2;color:#991b1b}.rq.ok .st{background:#dcfce7;color:#14532d}
.rqq{margin:6px 0 10px;font-weight:800;font-size:1.15rem}.rq ul{list-style:none;margin:0;padding:0}
.rq li{padding:8px 12px;border-radius:12px;margin:6px 0;border:2px solid var(--line)}
.rq li.key{border-color:#15803d;background:#dcfce7;font-weight:700}.rq li.wrong{border-color:#dc2626;background:#fee2e2}
.ex{margin:12px 0 0;padding:12px 16px;background:#f1f5f9;border-radius:12px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#14213d;color:#fff;padding:12px 22px;border-radius:99px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.toast.on{opacity:1}
.materi{max-width:900px;margin:0 auto 28px;padding:18px clamp(18px,4vw,30px);text-align:left}
.res .materi{max-width:none;margin:22px 0}
.materi summary{cursor:pointer;font-weight:800;font-size:1.2rem;color:var(--acc-d)}
.materi h3{margin:20px 0 8px;font-size:1.1rem}
.materi table{width:100%;border-collapse:collapse;font-size:.98rem}
.materi th,.materi td{padding:10px 12px;border:1px solid var(--line);vertical-align:top;text-align:left}
.materi th{width:30%;background:var(--acc-l);color:var(--acc-d)}
.materi ol{margin:0;padding-left:22px}.materi li{margin:8px 0}
.trik{margin:10px 0 0;padding:12px 16px;background:#fffbeb;border-left:6px solid #f59e0b;border-radius:12px}

@media(max-width:640px){
  body{font-size:18px}
  .brand{display:none}.prog{margin-left:0;width:100%;justify-content:space-between}
  .passage{padding:22px 20px 8px}.q{padding:20px 18px 10px}
  .opt{padding:11px 12px;gap:12px}.opt b{width:36px;height:36px}
  .btn{padding:12px 16px;font-size:1rem}.pinfo{display:none}.pager{justify-content:space-between}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  .printid{display:block;margin:0 0 14px;font-weight:700}
  .top,.pager,.actions,.toast,.noprint,.aud,.spk{display:none!important}
  body{background:#fff}.card{box-shadow:none}
  main{padding:0}
}
</style>

  var tips=["Baca soal lebih dulu, lalu cari jawabannya di teks. Tandai nomor paragraf yang dimaksud.","Thesis statement: akhir paragraf pembuka. Topic sentence: awal paragraf isi.","Supporting sentence biasanya berisi contoh atau rincian, misalnya daftar benda atau akibat.","Ide pokok seluruh teks sama dengan isi thesis statement.","Coret pilihan yang hanya menyinggung satu detail atau memuat kata ekstrem.","Atur waktu: 30 menit untuk 10 soal, sekitar 3 menit per soal."];
  var h='<details class="card materi"'+(open?' open':'')+'><summary>📘 Ringkasan Materi &amp; Trik Menjawab Soal</summary><div class="mbody"><h3>Konsep penting</h3><table><tbody>';

var L="ABCDE",TOTAL=30*60,N=D.qs.length,KEYV=atob("Q0FEQkVCQ0FFRA==").split("").map(function(c){return c.charCodeAt(0)-65}),KEY="tes-formatif-bing-xi-love-env-v1";
var ACC=["#15803d","#0369a1"];
var TITLE="Soal Latihan Bahasa Inggris Kelas XI — Love Your Environment";
function $(s){return document.querySelector(s)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
var S={view:"start",t:0,name:"",kelas:"",sekolah:"",submitted:false,when:"",startAt:0,started:false,idk:"",ans:[]};
for(var i=0;i<N;i++)S.ans.push(-1);
/* ---------- pengacakan soal (per teks; soal tetap berada di teks asalnya) ---------- */
function ident(){var a=[];for(var i=0;i<N;i++)a.push(i);return a}
function shuffled(){
  var o=ident();
  do{
    for(var b=0;b<N;b+=5){
      for(var i=b+4;i>b;i--){var k=b+Math.floor(Math.random()*(i-b+1));var x=o[i];o[i]=o[k];o[k]=x}
    }
  }while(o.every(function(v,i){return v===i}));
  return o;
}
function validOrder(o){
  if(!Array.isArray(o)||o.length!==N)return false;
  var seen={};
  for(var i=0;i<N;i++){
    var v=o[i];
    if(typeof v!=="number"||v<0||v>=N||Math.floor(v/5)!==Math.floor(i/5)||seen[v])return false;
    seen[v]=1;
  }
  return true;
}
S.order=ident();
try{
  var j=JSON.parse(localStorage.getItem(KEY)||"null");
  if(j&&Array.isArray(j.ans)&&j.ans.length===N){
    S.ans=j.ans.map(function(a){return typeof a==="number"&&a>=0&&a<5?a:-1});
    S.name=typeof j.name==="string"?j.name:"";
    S.kelas=typeof j.kelas==="string"?j.kelas:"";S.sekolah=typeof j.sekolah==="string"?j.sekolah:"";
    S.t=j.t>=0&&j.t<2?j.t:0;S.started=!!j.started;
    if(validOrder(j.order))S.order=j.order;
    S.startAt=typeof j.startAt==="number"?j.startAt:0;S.idk=typeof j.idk==="string"?j.idk:"";S.submitted=!!j.submitted&&S.started;S.when=typeof j.when==="string"?j.when:"";
    S.view=(S.submitted||(j.view==="result"&&S.started))?"result":"start";
    if(S.view==="result")S.submitted=true;
  }
}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({order:S.order,ans:S.ans,submitted:S.submitted,when:S.when,startAt:S.startAt,name:S.name,kelas:S.kelas,sekolah:S.sekolah,t:S.t,started:S.started,idk:S.idk,view:S.view}))}catch(e){}}
/* ---------- daftar identitas yang sudah mengumpulkan (anti-ulang) ---------- */
var REG=KEY+"-reg";
function idKey(){return [S.name,S.kelas,S.sekolah].map(function(v){return String(v||"").normalize("NFKD").replace(/\p{M}/gu,"").toLowerCase().replace(/[^\p{L}\p{N}]+/gu,"")}).join("|")}
function regGet(){try{var r=JSON.parse(localStorage.getItem(REG)||"[]");return Array.isArray(r)?r:[]}catch(e){return []}}
function regAdd(k){if(!k||k==="||")return;try{var r=regGet();if(r.indexOf(k)<0){r.push(k);localStorage.setItem(REG,JSON.stringify(r))}}catch(e){}}
function markDone(){regAdd(idKey());regAdd(S.idk)}
function done(){return S.ans.filter(function(a){return a>=0}).length}
function doneT(t){return S.ans.slice(t*5,t*5+5).filter(function(a){return a>=0}).length}

/* ---------- timer hitung mundur ---------- */
function remaining(){return S.startAt?Math.max(0,TOTAL-Math.floor((Date.now()-S.startAt)/1000)):TOTAL}
function fmt(sec){var m=Math.floor(sec/60),r=sec%60;return (m<10?"0":"")+m+":"+(r<10?"0":"")+r}
function tcls(sec){return sec<=300?" danger":sec<=600?" warn":""}
function timerHTML(){var r=remaining();return '<div class="timer'+tcls(r)+'" role="timer" aria-label="Sisa waktu"><span aria-hidden="true">⏱</span> <b class="tv">'+fmt(r)+'</b></div>'}
function tick(){
  if(!S.started||S.submitted||!S.startAt)return;
  var r=remaining();
  Array.prototype.forEach.call(document.querySelectorAll(".tv"),function(e){e.textContent=fmt(r)});
  Array.prototype.forEach.call(document.querySelectorAll(".timer"),function(e){e.className="timer"+tcls(r)});
  if(r<=0){S.submitted=true;markDone();S.when=new Date().toISOString();go("result");toast("Waktu habis. Jawaban dikumpulkan otomatis.")}
}

/* ---------- identitas peserta ---------- */
function fieldHTML(pre,key,label,ph,ac){
  return '<div class="field"><label for="'+pre+key+'">'+label+' <span class="req" aria-hidden="true">*</span></label>'+
    '<input id="'+pre+key+'" data-f="'+key+'" type="text" required aria-required="true" maxlength="80" autocomplete="'+ac+'" placeholder="'+ph+'" value="'+esc(S[key])+'">'+
    '<span class="err" role="alert">Wajib diisi</span></div>';
}
function idFields(pre){
  return '<div class="idgrid">'+fieldHTML(pre,"name","Nama siswa","Tulis nama lengkap","name")+fieldHTML(pre,"kelas","Kelas","Tulis kelas Anda","off")+fieldHTML(pre,"sekolah","Asal sekolah","Tulis nama sekolah","organization")+'</div>';
}

/* ---------- potongan tampilan ---------- */
function topHTML(){
  if(S.view==="start")return "";
  if(S.view==="result")return '<div class="row"><div class="brand" style="display:block">Soal Latihan · Bahasa Inggris</div></div>';
  var d=done();
  var h='<div class="row"><div class="brand">Soal Latihan · Bahasa Inggris</div><div class="prog">'+timerHTML()+'<span>'+d+'/'+N+' terjawab</span><div class="bar" aria-hidden="true"><i style="width:'+(d/N*100)+'%"></i></div></div></div><nav class="steps" aria-label="Navigasi teks">';
  D.texts.forEach(function(t,i){
    h+='<button class="step" data-act="step" data-t="'+i+'"'+(S.view==="text"&&S.t===i?' aria-current="true"':'')+'>'+t.s+'<small>'+doneT(i)+'/5</small></button>';
  });
  h+='<button class="step" data-act="finish"'+(S.view==="result"?' aria-current="true"':'')+'>Kumpulkan</button></nav>';
  return h;
}
function pagerHTML(){
  if(S.view!=="text")return "";
  var last=S.t===1;
  return '<button class="btn ghost" data-act="prev"'+(S.t===0?' disabled':'')+'>‹ Sebelumnya</button>'+
    '<div class="pinfo">Bagian '+(S.t+1)+' dari 2 · '+doneT(S.t)+'/5 soal terjawab</div>'+
    (last?'<button class="btn" data-act="finish">Kumpulkan jawaban ✓</button>':'<button class="btn" data-act="next">Bagian berikutnya ›</button>');
}
function qHTML(n){
  var id=S.order[n],q=D.qs[id],a=S.ans[id];
  var h='<article class="card q'+(a>=0?' done':'')+'" id="q'+n+'"><div class="qh"><span class="qn">Soal '+(n+1)+'</span><span class="tag">'+esc(q.k)+'</span></div><fieldset><legend>'+esc(q.q)+'</legend>';
  q.o.forEach(function(o,i){
    h+='<label class="opt'+(a===i?' sel':'')+'"><input type="radio" name="q'+id+'" value="'+i+'"'+(a===i?' checked':'')+'><b>'+L[i]+'</b><span>'+esc(o)+'</span></label>';
  });
  return h+'</fieldset></article>';
}
function startHTML(){
  var d=done();
  var h='<section class="hero"><span class="pillk">KUIS DESCRIPTIVE TEXT · UNIT 2 · LOVE YOUR ENVIRONMENT</span><h1>Soal Latihan<br>Bahasa Inggris Kelas XI</h1><p class="sub">Love Your Environment · Descriptive Text</p><p class="meta">1 teks · 10 soal pilihan ganda · 30 menit</p><div class="topics">';
  D.texts.forEach(function(t,i){
    h+='<div class="card topic" style="--c:'+ACC[i]+'"><small>BAGIAN '+(i+1)+' · SOAL '+(i*5+1)+'–'+(i*5+5)+'</small><b>'+esc(t.title)+'</b></div>';
  });
  h+='</div><div class="card howto"><h3>Petunjuk</h3><ul><li>Baca teks pada Bagian 1, lalu jawab lima soal di sampingnya (atau di bawahnya pada layar kecil). Bagian 2 berisi ringkasan konsep dan lima soal lainnya.</li><li>Pilih <b>satu</b> jawaban untuk setiap soal. Jawaban boleh diubah kapan saja sebelum dikumpulkan.</li><li>Tekan <b>▶ Putar teks</b> untuk mendengarkan narator berbahasa Inggris, atau tekan ikon 🔊 untuk satu paragraf.</li><li>Anda bebas berpindah antar bagian lewat tombol di bagian atas.</li><li>Waktu pengerjaan <b>30 menit</b> dengan hitung mundur yang dimulai saat Anda menekan <b>Mulai Kuis</b>. Jawaban dikumpulkan otomatis ketika waktu habis.</li><li>Jawaban tersimpan otomatis di perangkat ini.</li><li>Setelah selesai, tekan <b>Kumpulkan jawaban</b> untuk melihat skor Anda. Jawaban <b>tidak dapat diubah</b> setelah dikumpulkan.</li></ul></div>';
  h+=materiHTML(false)+'<div class="card idcard"><h3>Identitas Peserta</h3><p class="note">Isi semua kolom (<span style="color:#dc2626">*</span>) sebelum memulai kuis.</p>'+idFields("f_")+'<div class="go" style="flex-direction:column;align-items:center;gap:10px">'+(S.startAt&&!S.submitted?'<p class="note" style="margin:0">Waktu sedang berjalan · sisa <b class="tv">'+fmt(remaining())+'</b></p>':'')+'<button class="btn big" data-act="start">'+(d>0?'Lanjutkan ('+d+'/'+N+' terjawab)':'Mulai Kuis')+'</button></div></div></section>';
  return h;
}
function textHTML(){
  var t=S.t,T=D.texts[t],p1=t===0;
  var h='<div class="wrap"><section class="card passage" aria-label="'+(p1?'Teks bacaan':'Ringkasan konsep')+'"><div class="kick">Bagian '+(t+1)+' dari 2 · Soal '+(t*5+1)+'–'+(t*5+5)+'</div><h2>'+esc(T.title)+'</h2><p class="hint">'+(p1?'Angka di sebelah kiri menunjukkan nomor paragraf.':'Ringkasan ini boleh dibaca selama mengerjakan soal.')+'</p>'+(p1?audioBar():'');
  T.paras.forEach(function(p,i){h+='<div class="para"><span class="pn" aria-label="'+(p1?'Paragraf ':'Butir ')+(i+1)+'">'+(i+1)+'</span><p><span class="tag" style="margin-right:8px">'+esc(T.labels[i])+'</span>'+esc(p)+'</p>'+(p1?'<button class="spk" data-act="line" data-i="'+i+'" aria-label="Dengarkan paragraf '+(i+1)+'" title="Dengarkan">🔊</button>':'')+'</div>'});
  h+='</section><section aria-label="Soal">';
  for(var n=t*5;n<t*5+5;n++)h+=qHTML(n);
  return h+'</section></div>';
}
function score(){var c=0;for(var i=0;i<N;i++)if(S.ans[i]===KEYV[i])c++;return c}
function reviewHTML(){
  var h='<div class="rv"><h2>Kunci &amp; Pembahasan</h2>';
  for(var n=0;n<N;n++){
    var id=S.order[n],q=D.qs[id],a=S.ans[id],k=KEYV[id],ok=a===k;
    h+='<article class="card rq'+(ok?' ok':'')+'"><div class="qh"><span class="qn">Soal '+(n+1)+'</span><span class="tag">Bagian '+(Math.floor(n/5)+1)+'</span><span class="tag">'+esc(q.k)+'</span><span class="tag st">'+(ok?'Benar':a<0?'Tidak dijawab':'Salah')+'</span></div><p class="rqq">'+esc(q.q)+'</p><ul>';
    q.o.forEach(function(o,i){h+='<li class="'+(i===k?'key':i===a?'wrong':'')+'"><b>'+L[i]+'.</b> '+esc(o)+(i===k?' ✓':i===a?' ✗ (jawaban Anda)':'')+'</li>'});
    h+='</ul><p class="ex"><b>Pembahasan:</b> '+esc(q.e)+'</p><p class="trik"><b>💡 Trik:</b> '+esc(TRIK[id])+'</p></article>';
  }
  return h+'</div>';
}
function resultHTML(){
  var c=score(),nilai=Math.round(c/N*100);
  var w=S.when?new Date(S.when):new Date();
  var h='<section class="res"><div class="kick">Hasil Kuis</div><h1>Skor Anda</h1><div class="card scorecard">';
  h+='<div class="sc-n" aria-label="Nilai '+nilai+' dari 100">'+nilai+'</div><div class="sc-l">Nilai (skala 0–100)</div>';
  h+='<div class="sc-d">Jawaban benar <b>'+c+'</b> dari <b>'+N+'</b> soal</div>';
  h+='<dl class="sc-id"><dt>Nama</dt><dd>'+esc(S.name)+'</dd><dt>Kelas</dt><dd>'+esc(S.kelas)+'</dd><dt>Asal sekolah</dt><dd>'+esc(S.sekolah)+'</dd><dt>Waktu</dt><dd>'+esc(w.toLocaleString("id-ID"))+'</dd></dl>';
  h+='</div>'+materiHTML(true)+reviewHTML();return h+'</section>';
}

/* ---------- audio narator (SpeechSynthesis, en-GB pria) ---------- */
var AU={tok:0,on:false};
var MALE=/daniel|george|ryan|arthur|oliver|thomas|james|male/i,FEM=/female|serena|kate|susan|hazel|libby|sonia|stephanie|martha|fiona|amy|emma|mia/i;
function ttsOK(){return "speechSynthesis" in window&&"SpeechSynthesisUtterance" in window}
if(ttsOK())try{speechSynthesis.getVoices()}catch(e){}
function pickVoice(){
  var vs=speechSynthesis.getVoices()||[];
  var gb=vs.filter(function(v){return /^en[-_]GB$/i.test(v.lang)});
  var m=gb.filter(function(v){return MALE.test(v.name)&&!FEM.test(v.name)});
  var pool=m.length?m:gb.filter(function(v){return !FEM.test(v.name)});
  return pool[0]||gb[0]||vs.filter(function(v){return /^en/i.test(v.lang)})[0]||null;
}
function astatus(m){var e=$("#astat");if(e)e.textContent=m||""}
function hl(i){Array.prototype.forEach.call(document.querySelectorAll(".para"),function(e,k){e.classList.toggle("speaking",k===i)})}
function stopAudio(){AU.tok++;AU.on=false;if(ttsOK())try{speechSynthesis.cancel()}catch(e){}hl(-1);astatus("")}
var GEN={Rina:"f",Dani:"m",Maya:"f",Bagas:"m",Sinta:"f",Arif:"m"};
function pickG(g){
  var vs=speechSynthesis.getVoices()||[];
  var gb=vs.filter(function(v){return /^en[-_]GB$/i.test(v.lang)});
  var en=vs.filter(function(v){return /^en/i.test(v.lang)});
  function f(a){return a.filter(function(v){var fem=FEM.test(v.name);return g==="f"?fem:(!fem&&MALE.test(v.name))})}
  var r=f(gb);if(r.length)return {v:r[0],ok:true};
  r=f(en);if(r.length)return {v:r[0],ok:false};
  if(g==="m"){r=gb.filter(function(v){return !FEM.test(v.name)});if(r.length)return {v:r[0],ok:true}}
  return {v:gb[0]||en[0]||null,ok:false};
}
function narrLines(){return D.texts[S.t].paras.map(function(p){var m=p.match(/^([^:]+):\s*([\s\S]*)$/);return m?{g:GEN[m[1]]||"m",t:m[2]}:{g:"m",t:p}})}
function sayFrom(i,only){
  stopAudio();
  if(!ttsOK()){astatus("Peramban ini tidak mendukung audio narator.");return}
  var ls=narrLines(),tok=AU.tok,vm=pickG("m"),vf=pickG("f"),same=vm.v===vf.v,rEl=$("#rate"),rate=rEl?+rEl.value:0.9;
  AU.on=true;
  astatus("Narator: "+(vm.v?vm.v.name:"suara bawaan"));
  function end(){if(tok===AU.tok){AU.on=false;hl(-1)}}
  function next(k){
    if(tok!==AU.tok)return;
    if(k>=ls.length){end();return}
    var sp=ls[k],pk=sp.g==="f"?vf:vm,u=new SpeechSynthesisUtterance(sp.t);u.lang="en-GB";u.rate=rate;if(pk.v)u.voice=pk.v;u.pitch=same?(sp.g==="f"?1.25:0.8):1;
    u.onstart=function(){if(tok===AU.tok)hl(k)};
    u.onend=function(){if(tok!==AU.tok)return;if(only)end();else next(k+1)};
    u.onerror=end;
    speechSynthesis.speak(u);
  }
  setTimeout(function(){next(i)},80);
}
function audioBar(){
  if(!ttsOK())return '<p class="note">Audio narator tidak didukung di peramban ini.</p>';
  return '<div class="aud"><button class="btn" data-act="play">▶ Putar teks</button><button class="btn ghost" data-act="stop">■ Stop</button><label>Kecepatan <select id="rate" aria-label="Kecepatan audio"><option value="0.75">Lambat</option><option value="0.9" selected>Normal</option><option value="1.05">Cepat</option></select></label><div class="astat" id="astat" role="status" aria-live="polite"></div></div>';
}

/* ---------- render & aksi ---------- */
function fit(){var t=$("#top");document.documentElement.style.setProperty("--hdr",(t&&t.offsetHeight?t.offsetHeight:0)+"px")}
function meta(){$("#top").innerHTML=topHTML();$("#pager").innerHTML=pagerHTML();fit()}
function render(){
  stopAudio();
  document.body.className=S.view==="text"?"th"+S.t:"";
  $("#app").innerHTML=S.view==="start"?startHTML():S.view==="text"?textHTML():resultHTML();
  meta();
  document.title=S.view==="text"?"Bagian "+(S.t+1)+" · Kuis Love Your Environment":"Kuis Love Your Environment – Descriptive Text";
}
function go(view,t,scrollN){
  S.view=view;if(t!=null)S.t=t;save();render();
  if(scrollN!=null){var el=$("#q"+scrollN);if(el){el.scrollIntoView({block:"start"});var r=el.querySelector("input");return}}
  window.scrollTo(0,0);
}
var tt;
function toast(m){var e=$("#toast");e.textContent=m;e.classList.add("on");clearTimeout(tt);tt=setTimeout(function(){e.classList.remove("on")},2200)}
document.addEventListener("click",function(e){
  var b=e.target.closest&&e.target.closest("[data-act]");if(!b)return;
  var a=b.dataset.act;
  if(a==="start"){
    var bad=null;
    ["name","kelas","sekolah"].forEach(function(k){
      var el=$("#f_"+k),v=el?el.value.trim():"";S[k]=v;
      if(el)el.closest(".field").classList.toggle("bad",!v);
      if(!v&&!bad)bad=el;
    });
    if(bad){save();bad.focus();return}
    if(!(S.started&&!S.submitted)&&regGet().indexOf(idKey())>=0){
      ["name","kelas","sekolah"].forEach(function(k){var el=$("#f_"+k);if(el&&el.closest(".field"))el.closest(".field").classList.add("bad")});
      save();window.alert("Identitas ini sudah pernah mengumpulkan kuis, sehingga kuis tidak dapat diulang. Periksa kembali nama, kelas, dan sekolah Anda. Jika merasa ini keliru, hubungi guru.");return}
    if(done()===0)S.order=shuffled();if(!S.startAt)S.startAt=Date.now();if(!S.idk)S.idk=idKey();S.started=true;go("text",S.t)}
  else if(a==="play")sayFrom(0,false);
  else if(a==="line")sayFrom(+b.dataset.i,true);
  else if(a==="stop")stopAudio();
  else if(a==="step")go("text",+b.dataset.t);
  else if(a==="prev"&&S.t>0)go("text",S.t-1);
  else if(a==="next"&&S.t<1)go("text",S.t+1);
  else if(a==="finish"){
    if(S.submitted)return;
    var un=N-done();
    var msg=(un>0?"Masih ada "+un+" soal yang belum dijawab.\n":"")+"Setelah dikumpulkan, jawaban tidak dapat diubah. Kumpulkan sekarang?";
    if(window.confirm(msg)&&!S.submitted){S.submitted=true;markDone();S.when=new Date().toISOString();go("result")}
  }
});
document.addEventListener("change",function(e){
  var r=e.target;
  if(!r||!r.matches||!r.matches('input[type="radio"]'))return;
  if(S.submitted)return;var n=+r.name.slice(1);S.ans[n]=+r.value;save();
  var card=r.closest(".q");card.classList.add("done");
  card.querySelectorAll(".opt").forEach(function(l,i){l.classList.toggle("sel",i===S.ans[n])});
  meta();
});
document.addEventListener("input",function(e){
  var t=e.target;
  if(t&&t.dataset&&t.dataset.f){S[t.dataset.f]=t.value.trim();save();if(t.value.trim()&&t.closest(".field"))t.closest(".field").classList.remove("bad")}
});
window.addEventListener("resize",fit);
if(S.submitted)markDone();
render();
tick();setInterval(tick,1000);
document.addEventListener("visibilitychange",tick);
})();
</script>
